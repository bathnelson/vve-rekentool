<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekenhulp VvE-subsidie Haarlem</title>
<meta name="description" content="Stap voor stap de rekentool voor de Subsidieregeling verduurzaming Haarlemse VvE's 2026 invullen.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f6f7f4; --surface:#ffffff; --surface-2:#eef1ec; --text:#1d2420; --muted:#5b665f;
  --border:#d6ddd6; --accent:#1f6f4a; --accent-ink:#ffffff; --accent-soft:#e2f0e8;
  --danger:#b3261e; --danger-soft:#fbe9e7; --warn:#8a5a00; --warn-soft:#fff4dc;
  --ok:#1f6f4a; --ok-soft:#e2f0e8; --focus:#2f7dd1; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --todo:#fff5cc; --todo-border:#e3c14f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1b201d; --surface-2:#232a26; --text:#e7ece8; --muted:#9aa69f;
    --border:#333d37; --accent:#5cc28d; --accent-ink:#0d1a13; --accent-soft:#1e3328;
    --danger:#ff8a80; --danger-soft:#3a1f1d; --warn:#f2c46b; --warn-soft:#352b14;
    --ok:#5cc28d; --ok-soft:#1e3328; --focus:#7ab4f0; --shadow:none;
    --todo:#3a3116; --todo-border:#8a6d1f;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201d; --surface-2:#232a26; --text:#e7ece8; --muted:#9aa69f;
  --border:#333d37; --accent:#5cc28d; --accent-ink:#0d1a13; --accent-soft:#1e3328;
  --danger:#ff8a80; --danger-soft:#3a1f1d; --warn:#f2c46b; --warn-soft:#352b14;
  --ok:#5cc28d; --ok-soft:#1e3328; --focus:#7ab4f0; --shadow:none;
    --todo:#3a3116; --todo-border:#8a6d1f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.3rem;margin:0}
h2{font-size:1.3rem}
h3{font-size:1.02rem;margin-top:1.4em}
h2+h3,.card>h3:first-child{margin-top:0}
p{margin:0 0 .9em}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
header.top .wrap{padding-top:18px;padding-bottom:14px}
header.top .sub{color:var(--muted);font-size:.88rem;margin:2px 0 0}
header.top .kop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header.top .kop .btn{flex:none;margin-top:-2px}
@media (max-width:520px){header.top .kop .lang{display:none}header.top h1{font-size:1.2rem}}

/* stepper */
.steps{display:flex;gap:4px;list-style:none;margin:14px 0 0;padding:0;counter-reset:s}
.steps li{flex:1;min-width:0}
.steps button{all:unset;cursor:pointer;display:block;width:100%;padding:8px 0 0;border-top:4px solid var(--border);font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.steps li.done button{border-color:var(--accent);color:var(--text)}
.steps li.cur button{border-color:var(--accent);color:var(--accent);font-weight:650}
.steps button:disabled{cursor:default}
.steps .n{font-weight:700;margin-right:4px}
@media (max-width:640px){.steps .t{display:none}.steps li.cur .t{display:inline}.steps li.cur{flex:3}}

main{padding:22px 0 120px}
.legend{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.intro{color:var(--muted);margin-bottom:18px}
.lead{font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
ul.check{padding-left:0;list-style:none;margin:0 0 1em}
ul.check li{padding-left:28px;position:relative;margin:.35em 0}
ul.check li::before{content:"✓";position:absolute;left:4px;color:var(--accent);font-weight:700}

label.fld{display:block;margin-bottom:16px}
label.fld>span.l{display:block;font-weight:600;margin-bottom:4px}
.hint{display:block;color:var(--muted);font-size:.88rem;margin-top:3px}
input[type=text],input[type=number],select,textarea{
  font:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:9px 11px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
input.err,select.err{border-color:var(--danger)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid2.g21{grid-template-columns:2fr 1fr}
@media (max-width:560px){.grid2,.grid2.g21{grid-template-columns:1fr}}

.btn{font:inherit;font-weight:600;border-radius:10px;padding:11px 18px;min-height:46px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.link{border:none;background:none;color:var(--accent);padding:6px 4px;min-height:0;text-decoration:underline}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.note{border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:.95rem}
.note.info{background:var(--surface-2)}
.tip{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.note.warn{background:var(--warn-soft);color:var(--text);border-left:4px solid var(--warn)}
.note.err{background:var(--danger-soft);border-left:4px solid var(--danger)}
.note.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fielderr{color:var(--danger);font-size:.88rem;margin-top:4px;display:block}

/* bottom nav */
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);z-index:5}
.navbar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.navbar .sum{flex:1;min-width:0;font-size:.85rem;color:var(--muted);line-height:1.3}
.navbar .sum .m{display:none}
@media (max-width:520px){.navbar .wrap{gap:8px}.navbar .btn{padding:10px 11px;font-size:.95rem}.navbar .sum b{font-size:.98rem;white-space:nowrap}.navbar .sum .d{display:none}.navbar .sum .m{display:inline}}
.navbar .sum b{display:block;color:var(--text);font-size:1.05rem}

/* woningen */
.bulk{background:var(--surface-2);border-radius:10px;padding:16px;margin-bottom:16px}
.bulk .g{display:grid;grid-template-columns:2fr 1.3fr 1fr 1.2fr;gap:0 10px}
@media (max-width:640px){.bulk .g{grid-template-columns:1fr 1fr}}
.bulk label.fld{margin-bottom:10px}
.wrow .mini{display:block;font-size:.78rem;color:var(--muted);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}
.chips label{display:flex;align-items:center;gap:6px;font-size:.95rem;cursor:pointer}
.chips input{width:18px;height:18px;accent-color:var(--accent)}
.setall{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center;margin:0 0 14px;padding:8px 12px;background:var(--surface-2);border-radius:10px}
.setall select{min-height:36px;padding:5px 8px;font-size:.92rem}
.setall>span{font-size:.85rem;color:var(--muted);font-weight:600}
.filter{display:flex;gap:6px;margin:0 0 10px}
.filter button{all:unset;cursor:pointer;font-size:.88rem;padding:5px 12px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.filter button[aria-pressed=true]{background:var(--text);color:var(--surface);border-color:var(--text)}
.filter button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wlist{border-top:1px solid var(--border)}
.wrow{border-bottom:1px solid var(--border);padding:8px 0}
.wrow .r1{display:grid;grid-template-columns:minmax(150px,1.4fr) 128px minmax(0,2fr) auto;grid-template-areas:"head woz vals meer";gap:8px;align-items:center}
.wrow .head{grid-area:head;display:flex;flex-direction:column;min-width:0}
.wrow .wozf{grid-area:woz;position:relative}
.wrow .wozf::before{content:"€";position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;pointer-events:none}
.wrow .wozf input{min-height:38px;padding:6px 8px 6px 22px;font-size:.92rem;text-align:right;font-variant-numeric:tabular-nums}
input.woz-ja{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:650}
input.woz-nee{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);font-weight:650}
.wrow .vals{grid-area:vals;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.wrow .vals select{flex:1 1 92px;width:auto;min-width:92px}
.wrow .geenmsg{grid-area:vals;display:none;color:var(--danger);font-size:.88rem;font-weight:600}
.won.geen .vals,.won.geen .bd{display:none}
.won.geen .geenmsg{display:block}
.won.geen .head b{color:var(--muted);font-weight:500}
.wrow .meer{grid-area:meer}
.wrow .seg{margin:0;flex:none}
.wrow .seg label{padding:6px 10px;font-size:.88rem}
.seg.leeg{background:var(--todo);border-color:var(--todo-border)}
.seg.err{border-color:var(--danger)}
/* energielabels in de officiële kleuren */
.lb-A{--lb:#00a651;--lbi:#fff}.lb-B{--lb:#50b848;--lbi:#fff}.lb-C{--lb:#bed630;--lbi:#1d2420}.lb-D{--lb:#fff200;--lbi:#1d2420}
.lb-E{--lb:#fdb913;--lbi:#1d2420}.lb-F{--lb:#f37021;--lbi:#fff}.lb-G{--lb:#ed1c24;--lbi:#fff}.lb-X{--lb:#8a948e;--lbi:#fff}
select.lbl[class*="lb-"]{background-color:var(--lb);color:var(--lbi);border-color:var(--lb);font-weight:700}
select.lbl option{background:var(--surface);color:var(--text);font-weight:400}
.eb{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;padding:0 3px;border-radius:4px;background:var(--lb);color:var(--lbi);font-weight:800;font-size:.78rem;line-height:1;vertical-align:1px;margin-right:6px}
.wrow .head b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .head .meta{font-size:.78rem;color:var(--muted)}
.wrow .st{width:22px;text-align:center;font-weight:700}
.wrow .st.ok{color:var(--ok)} .wrow .st.todo{color:var(--todo-border)} .wrow .st.uit{color:var(--danger)}
.wrow select{min-height:38px;padding:6px 8px;font-size:.92rem}
.wrow .meer{display:flex;gap:2px}
.ib{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--muted);font-size:1rem}
.ib:hover{background:var(--surface-2);color:var(--text)}
.ib:focus-visible{outline:2px solid var(--focus)}
.ib.del:hover{color:var(--danger)}
.wrow .addr{display:grid;grid-template-columns:2fr .8fr .8fr 1.3fr;gap:8px;margin-top:8px}
.wrow .bd{margin-top:6px;padding:5px 8px;border-radius:8px;background:var(--surface-2);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.85rem}
.wrow .bd .lbl{font-weight:600;font-size:.82rem;margin-right:4px}
/* bouwdelen als aan/uit-knopjes */
.wrow .bd label{display:inline-flex;align-items:center;cursor:pointer;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);user-select:none}
.wrow .bd label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.wrow .bd label:has(input:disabled){opacity:.45;cursor:default}
.wrow .bd label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:1px}
.wrow .bd input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}
.wrow .bd input[type=text]{flex:1 1 180px;min-height:32px;padding:4px 8px;font-size:.9rem}
.wrow .bd .fielderr{flex-basis:100%;margin:0}
@media (max-width:700px){
  .wrow .r1{grid-template-columns:1fr auto auto;grid-template-areas:"head lbl meer" "woz seg seg"}
  .wrow .vals{display:contents}
  .wrow .vals .seg{grid-area:seg;justify-self:end}
  .wrow .vals select{grid-area:lbl;width:116px;min-width:0}
  .wrow .geenmsg{grid-area:seg;align-self:center;justify-self:end;text-align:right;max-width:175px;font-size:.82rem}
  .wrow .meer{justify-content:flex-end}.wrow .addr{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.setall{grid-template-columns:1fr 1fr}.setall>span{grid-column:1/-1}}

/* maatregelen */
.grp{margin-bottom:16px}
.grp>h3{margin:0 0 6px;font-size:.98rem}
.grp>h3 .gt{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:6px}
.mt{border:1.5px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--surface)}
.mt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.mt .tog{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;cursor:pointer}
.mt:not(.on) .eis{display:none}
.mt .tog input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.mt .tog .nm{font-weight:600}
.mt .tog .rt{margin-left:auto;white-space:nowrap;font-size:.85rem;color:var(--muted);text-align:right;padding-top:2px}
.mt .eis{display:block;font-size:.85rem;color:var(--muted)}
.mt .body{padding:0 12px 12px 42px}
@media (max-width:560px){.mt .body{padding-left:14px}}
.mt .calc{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
@media (max-width:560px){.mt .calc{grid-template-columns:1fr}}
.out{font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:8px;padding:9px 11px;min-height:44px}
.out b{font-size:1.05rem}
.confirm{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:.93rem}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:.93rem}
.chk .ic{flex:none;width:20px;text-align:center;font-weight:700}
.chk.ok .ic{color:var(--ok)} .chk.warn .ic{color:var(--warn)} .chk.info .ic{color:var(--muted)}
.chk.warn{color:var(--text)} .chk .sub{display:block;color:var(--muted);font-size:.85rem}
.confirm input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:2px}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin:6px 0 4px}
.seg label{padding:8px 14px;cursor:pointer;font-size:.95rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}

/* verdeling table */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table.vd{border-collapse:collapse;width:100%;font-size:.9rem}
table.vd th,table.vd td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.vd th{background:var(--surface-2);font-weight:600;vertical-align:bottom;position:sticky;top:0}
table.vd th.l,table.vd td.l{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.vd th.l{background:var(--surface-2);z-index:2}
table.vd td input{width:84px;min-height:36px;padding:5px 7px;text-align:right}
table.vd td input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
table.vd tfoot td{font-weight:650;background:var(--surface-2)}
table.vd td.bad{color:var(--danger);font-weight:700}
table.vd td.cellbad input{border-color:var(--danger)}
table.vd td input.vast{font-weight:700;border-color:var(--accent)}
table.vd .rate{display:block;font-weight:400;color:var(--muted);font-size:.78rem}

/* controle */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media (max-width:640px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.kpi .k{font-size:.85rem;color:var(--muted)}
.kpi .v{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
table.sum{width:100%;border-collapse:collapse;font-size:.93rem}
table.sum td,table.sum th{padding:7px 6px;border-bottom:1px solid var(--border);text-align:left}
table.sum td.r,table.sum th.r{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.85rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--danger-soft);color:var(--danger)}
ol.todo{padding-left:22px}
ol.todo li{margin:.4em 0}
details{margin-top:10px}
summary{cursor:pointer;font-weight:600}

.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;z-index:10;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);max-height:280px;overflow:auto}
.ac-list li{padding:9px 10px;border-radius:6px;cursor:pointer}
.ac-list li[aria-selected="true"],.ac-list li:hover{background:var(--accent-soft)}
.ac-list li.leeg{color:var(--muted);cursor:default;background:none}
.ac-list .main{display:block}
.ac-list .main b{color:var(--accent)}
.ac-list .place{display:flex;align-items:center;gap:4px;font-size:.85rem;color:var(--muted)}
.ac-list .place svg{width:.9em;height:.9em;flex:none}
.vvestatus{margin-top:8px}
/* verplichte velden die nog leeg zijn */
input.leeg,select.leeg{background:var(--todo);border-color:var(--todo-border)}
input.leeg.err,select.leeg.err{border-color:var(--danger)}
.confirm.leeg{background:var(--todo);border-radius:8px;padding:6px 8px;margin-left:-8px}
.wrow .bd.leeg{background:var(--todo);outline:1.5px solid var(--todo-border)}
.legenda{display:inline-block;width:.9em;height:.9em;border-radius:3px;background:var(--todo);border:1px solid var(--todo-border);vertical-align:-1px;margin-right:4px}
#report{display:none}
@media print{
  body{background:#fff;color:#000;font-size:10pt}
  header.top,main,.navbar{display:none!important}
  #report{display:block}
  #report h1{font-size:15pt}
  #report h2{font-size:12pt;margin-top:14pt}
  #report table{border-collapse:collapse;width:100%;font-size:8.5pt}
  #report th,#report td{border:1px solid #999;padding:3px 4px;text-align:left;vertical-align:top}
  #report td.r,#report th.r{text-align:right}
  #report .pb{page-break-before:always}
  @page{size:A4 landscape;margin:12mm}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="kop"><div><h1>Rekenhulp VvE-subsidie</h1>
      <p class="sub">Subsidieregeling verduurzaming Haarlemse VvE's 2026</p></div>
      <button class="btn small ghost" data-act="reset" title="Alle ingevulde gegevens wissen" aria-label="Opnieuw beginnen">↺ Opnieuw<span class="lang"> beginnen</span></button></div>
    <ol class="steps" id="steps"></ol>
  </div>
</header>
<main><div class="wrap"><p class="legend" id="legend" hidden><span class="legenda"></span>Gele velden moeten nog worden ingevuld.</p><div id="view"></div></div></main>
<nav class="navbar" aria-label="Stappen">
  <div class="wrap">
    <button class="btn" id="prev">← Vorige</button>
    <div class="sum" id="navsum"></div>
    <button class="btn primary" id="next">Volgende →</button>
  </div>
</nav>
<div id="report"></div>

<!-- VvE-gegevens: wordt door het VvE-dashboard ingevuld (zie generate.mjs). null = leeg formulier. -->
<script type="application/json" id="vve-data">null</script>
<script>
/* ======= Gegevens uit de rekentool (tabblad 1_Rekenblad, rijen 28-41) ======= */
const MAX_PER_WONING = 4000;
const MAX_ROWS = 126; // invulblad rijen 32 t/m 157

function blank(){
  const s={step:0,vve:'',vveAdres:'',A:'',offerteGebouw:'ja',woningen:[],mt:{},verdeling:{},mode:{}};

/* Zet de gegevens uit de adresverkenner om naar de formulierstatus. Ruim in wat het accepteert. */
function fromPre(d,s){
  const low=v=>String(v??'').trim().toLowerCase();
  const eig=v=>{v=low(v); return v.includes('verhuur')?'eigenaar-verhuurder':v.includes('bewon')?'eigenaar-bewoner':'';};
  const label=v=>{v=String(v??'').trim().toUpperCase(); if(!v) return ''; if(/^A\+*$/.test(v)) return 'A'; if(/^[A-G]$/.test(v)) return v; return v.startsWith('ONB')||v.startsWith('GEEN')?'Onbekend':'';};
  const woz=w=>{ const v=low(w.woz); if(v.startsWith('bov')) return 'Boven'; if(v.startsWith('ond')) return 'Onder'; if(v.startsWith('onb')) return 'Onbekend';
    const g=num(d.wozGemiddelde)||WOZ_GRENS, x=num(w.wozWaarde); return x?(x<g?'Onder':'Boven'):''; };
  s.vve=d.naam||'';
  s.vveAdres=d.adres||'';
  const alle=Array.isArray(d.woningen)?d.woningen:[];
  const mee=alle.filter(w=>w.doetMee!==false);
  s.A=String(d.aantalWoningenGebouw||alle.length||'');
  s.woningen=mee.slice(0,MAX_ROWS*2).map(w=>{ const lb=label(w.energielabel);
    return newW({straat:w.straat||'',nr:String(w.huisnummer??w.nr??''),toev:String(w.toevoeging??w.toev??''),plaats:w.woonplaats||w.plaats||'Haarlem',
      woz:woz(w),eig:eig(w.eigenaar),label:lb,bd:(w.slechteBouwdelen||[]).filter(b=>BOUWDELEN.includes(b)),
      bdAnders:(w.slechteBouwdelen||[]).filter(b=>!BOUWDELEN.includes(b)).join(', '),wozWaarde:num(w.wozWaarde)||null,...(num(w.wozWaarde)?{auto:{woz:woz(w),wozWaarde:num(w.wozWaarde)}}:{}),nummeraanduiding:/^\d{16}$/.test(w.nummeraanduiding||'')?w.nummeraanduiding:''}); });
  const alias={spouwmuur:'G',gevelbinnen:'H',gevelbuiten:'I',dak:'J',zoldervloer:'K',vloer:'L',bodem:'M',hrglas:'N',hrpanelen:'O',deuren:'P',tripleglas:'Q',triplepanelen:'R',tripledeuren:'S',ventilatie:'T'};
  Object.entries(d.maatregelen||{}).forEach(([k,v])=>{ const code=MK[k]?k:alias[low(k).replace(/[^a-z]/g,'')]; if(!code||!v) return;
    s.mt[code]={on:true,offerte:MK[code].perWoning?'':String(v).replace('.',',')}; });
  if(d.offerteGeldtVoorHeleGebouw===false) s.offerteGebouw='nee';
  if(d.bouwjaar) s.bouwjaar=num(d.bouwjaar);
  return s;
}

/* ======= Hulpfuncties ======= */
const eur = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
const nf = new Intl.NumberFormat('nl-NL',{maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('nl-NL',{maximumFractionDigits:0});
const $ = s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(v){
  if(v===null||v===undefined) return 0;
  if(typeof v==='number') return isFinite(v)?v:0;
  let s=String(v).trim().replace(/\s/g,'').replace(/m²|m2|€/gi,'');
  if(!s) return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
function r2(n){return Math.round(n*100)/100;}
function fmtIn(n){return n?String(r2(n)).replace('.',','):'';}
function A(){return Math.round(num(S.A));}
// Alleen woningen met een WOZ-waarde onder de grens krijgen subsidie; de rest telt verder nergens mee.
function inAanvraag(w){ return w.woz!=='Boven'; }
function wozBekend(w){ return w.woz==='Boven'||w.woz==='Onder'; }
function wozUit(v){ return v?(v<WOZ_GRENS?'Onder':'Boven'):''; }
function WS(){ return S.woningen.filter(inAanvraag); }
function B(){return WS().length;}
function lbKlasse(l){ return l==='Onbekend'?'lb-X':l?'lb-'+l:''; }
function eb(l){ return l?`<span class="eb ${lbKlasse(l)}" title="${l==='Onbekend'?'Geen energielabel':'Energielabel '+l}">${l==='Onbekend'?'?':l}</span>`:''; }
function actief(){return M.filter(m=>S.mt[m.k]?.on);}
function adres(w){return [w.straat,w.nr,w.toev].filter(Boolean).join(' ').trim()||'(adres nog leeg)';}

/* aandeel van de offerte voor de woningen in deze aanvraag */
function deelM2(m){
  const t=S.mt[m.k]; if(!t?.on) return 0;
  if(m.perWoning) return 0;
  const off=num(t.offerte); const a=A(), b=B();
  if(S.offerteGebouw==='ja' && a>0) return off*b/a;
  return off;
}
function perWoningGelijk(m){
  const b=B(); if(!b) return 0;
  return r2(deelM2(m)/b);
}
function vdGet(w,k){ return S.verdeling[w.id]?.[k] ?? 0; }
function vdSet(w,k,v){ (S.verdeling[w.id] ||= {})[k]=v; }
// Zelf ingevulde cellen (S.vast[k] = woning-id's) blijven staan; de rest van de m² uit de offerte
// wordt gelijk over de overige woningen verdeeld. Afrondingsrest naar de laatste, zodat het totaal klopt.
// Verdeelsleutel per maatregel. 'slim': dak/zoldervloer naar de bovenste laag, vloer/bodem naar de begane
// grond (ligging uit EP-Online), overige m²-maatregelen naar woonoppervlakte (BAG). Zonder gegevens: gelijk.
function sleutel(k){
  const ws=WS();
  if(S.verdeelMethode==='gelijk') return {soort:'gelijk'};
  // Verdieping alleen gebruiken als die van álle woningen bekend is (EP-Online geeft hem alleen bij een label).
  const ligAlles=ws.length&&ws.every(w=>w.ligging>0);
  if('JK'.includes(k) && ligAlles && ws.some(w=>w.ligging===3)) return {soort:'boven', n:ws.filter(w=>w.ligging===3).length};
  if('LM'.includes(k) && ligAlles && ws.some(w=>w.ligging===1)) return {soort:'beneden', n:ws.filter(w=>w.ligging===1).length};
  if(ws.length && ws.every(w=>w.opp>0)) return {soort:'opp', ligOnbekend:'JKLM'.includes(k)&&!ligAlles};
  return {soort:'gelijk'};
}
function gewicht(k){ const sl=sleutel(k);
  return sl.soort==='boven'?w=>w.ligging===3?1:0 : sl.soort==='beneden'?w=>w.ligging===1?1:0 : sl.soort==='opp'?w=>w.opp:()=>1; }
function sleutelTekst(k){ const sl=sleutel(k);
  return sl.soort==='boven'?`alleen de ${sl.n} woning${sl.n===1?'':'en'} op de bovenste verdieping`
    : sl.soort==='beneden'?`alleen de ${sl.n} woning${sl.n===1?'':'en'} op de begane grond`
    : sl.soort==='opp'?(sl.ligOnbekend?'naar woonoppervlakte (verdieping niet van alle woningen bekend)':'naar woonoppervlakte') : 'gelijk over alle woningen'; }
function sleutelKort(k){ const sl=sleutel(k); return sl.soort==='boven'?'bovenste verdieping':sl.soort==='beneden'?'begane grond':sl.soort==='opp'?'naar woonoppervlakte':'gelijk'; }
function heeftSlimmeData(){ const ws=WS(); return ws.some(w=>w.ligging) || (ws.length && ws.every(w=>w.opp>0)); }
function vastIds(k){ const ids=new Set(WS().map(w=>w.id)); return (S.vast?.[k]||[]).filter(id=>ids.has(id)); }
function herverdeel(k){
  const m=MK[k];
  if(m.perWoning){ WS().forEach(w=>vdSet(w,k,S.mt[k]?.on?1:0)); return; }
  const vast=new Set(vastIds(k));
  const vrij=WS().filter(w=>!vast.has(w.id)); if(!vrij.length) return;
  const rest=Math.max(0, deelM2(m)-WS().filter(w=>vast.has(w.id)).reduce((s,w)=>s+num(vdGet(w,k)),0));
  const gw=gewicht(k); let g=vrij.map(w=>gw(w)); if(!g.some(x=>x>0)) g=vrij.map(()=>1);
  const som=g.reduce((a,b)=>a+b,0), laatste=g.map((x,i)=>x>0?i:-1).filter(i=>i>=0).pop();
  let verdeeld=0;
  vrij.forEach((w,i)=>{ if(i===laatste) return; const v=r2(rest*g[i]/som); verdeeld+=v; vdSet(w,k,v); });
  vdSet(vrij[laatste],k,Math.max(0,r2(rest-verdeeld)));
}
function syncVerdeling(){
  S.woningen.filter(w=>!inAanvraag(w)).forEach(w=>M.forEach(m=>vdSet(w,m.k,0)));
  M.forEach(m=>{
    if(!S.mt[m.k]?.on){ S.woningen.forEach(w=>vdSet(w,m.k,0)); return; }
    if(m.perWoning && S.mode[m.k]==='hand') WS().forEach(w=>{ if(S.verdeling[w.id]?.[m.k]===undefined) vdSet(w,m.k,1); });
    else herverdeel(m.k);
  });
}
function bedragWoning(w){ return actief().reduce((s,m)=>s+num(vdGet(w,m.k))*m.tarief,0); }
function m2Totaal(m){ return WS().reduce((s,w)=>s+num(vdGet(w,m.k)),0); }
function totaal(){ return actief().reduce((s,m)=>s+m2Totaal(m)*m.tarief,0); }

/* ======= Controles ======= */
function checks(){
  const err=[], warn=[]; const a=A(), b=B();
  if(!S.vve.trim()) err.push({s:1,t:'Vul de naam van de VvE in.'});
  if(!S.vveAdres.trim()) err.push({s:1,t:'Vul het adres van de VvE in.'});
  if(!(a>0)) err.push({s:1,t:'Vul het aantal woningen in het gebouw in.'});
  const nAlle=S.woningen.length, nGeen=nAlle-b;
  if(nAlle===0) err.push({s:2,t:'Voeg de adressen toe van de woningen waarvoor u subsidie aanvraagt.'});
  else if(b===0 && S.woningen.every(wozBekend)) err.push({s:2,t:`Geen van de woningen heeft een WOZ-waarde onder ${eur.format(WOZ_GRENS).replace(',00','')}. Er kan dan geen subsidie worden aangevraagd.`});
  if(a>0 && nAlle>a) err.push({s:2,t:`U heeft ${nAlle} woningen toegevoegd, maar het gebouw heeft er ${a}. Dat kan niet kloppen.`});
  if(b>MAX_ROWS) err.push({s:2,t:`De rekentool heeft plaats voor maximaal ${MAX_ROWS} adressen. U heeft er ${b}.`});
  let onvolledig=0, bd=0;
  S.woningen.forEach(w=>{
    if(!w.straat||!w.nr||!w.plaats||!wozBekend(w)) onvolledig++;
    else if(!inAanvraag(w)) return;
    else if(!w.eig||!w.label) onvolledig++;
    else if(w.label==='Onbekend' && !w.bdGeen && bouwdelen(w).length<2) bd++;
  });
  if(onvolledig) err.push({s:2,t:`${onvolledig} woning(en) zijn nog niet volledig ingevuld (adres, WOZ-waarde, eigenaar of energielabel).`});
  if(bd) err.push({s:2,t:`${bd} woning(en) met onbekend energielabel hebben nog geen 2 slechte bouwdelen.`});
  const act=actief();
  if(!act.length) err.push({s:3,t:'Kies minimaal één maatregel.'});
  act.forEach(m=>{
    const t=S.mt[m.k];
    if(!m.perWoning && !(num(t.offerte)>0)) err.push({s:3,t:`${m.naam}: vul het aantal m² uit de offerte in.`});
    if(OPP3D[m.k]&&S.opp3d?.[m.k]){ if(oppPct(m.k)<70) err.push({s:3,t:`${m.naam}: ${nf.format(num(t.offerte))} m² is ${nf.format(Math.round(oppPct(m.k)))}% van ${OPP3D[m.k].wat} (${nf.format(S.opp3d[m.k])} m²); minimaal 70% is vereist.`}); }
    else if(m.min==='70' && !t.ok70) err.push({s:3,t:`${m.naam}: bevestig dat het om ${m.minTekst} gaat.`});
    if(!t.eisOk) err.push({s:3,t:`${m.naam}: bevestig dat de offerte voldoet aan de eis (${m.eis}).`});
  });
  WS().forEach(w=>{
    const e=bedragWoning(w);
    if(e>MAX_PER_WONING) err.push({s:4,t:`${adres(w)}: ${eur.format(e)} is meer dan het maximum van ${eur.format(MAX_PER_WONING)} per woning.`});
    act.filter(m=>m.min==='m2').forEach(m=>{ const v=num(vdGet(w,m.k)); if(v>0 && v<m.minWaarde) err.push({s:4,t:`${adres(w)}: ${m.naam} is ${nf.format(v)} m², minimaal ${m.minWaarde} m² per woning.`}); });
    const glas=act.filter(m=>m.min==='glas').reduce((s,m)=>s+num(vdGet(w,m.k)),0);
    if(glas>0 && glas<3) err.push({s:4,t:`${adres(w)}: glas, panelen en deuren samen ${nf.format(glas)} m², minimaal 3 m² per woning.`});
    act.filter(m=>m.perWoning).forEach(m=>{ const v=num(vdGet(w,m.k)); if(v!==0&&v!==1) err.push({s:4,t:`${adres(w)}: ventilatie kan alleen 0 of 1 zijn.`}); });
  });
  if(S.bouwjaar>=BOUWJAAR_VOOR) warn.push({s:1,t:`Het gebouw is volgens de BAG in ${S.bouwjaar} gebouwd. De regeling geldt voor gebouwen die vóór ${BOUWJAAR_VOOR} zijn opgeleverd.`});
  Object.keys(MAX3D).forEach(k=>{ const t=S.mt[k], max=S.opp3d?.[k]; if(t?.on&&max&&num(t.offerte)>max) warn.push({s:3,t:`${MK[k].naam}: ${nf.format(num(t.offerte))} m² is meer dan alle buitenmuren samen volgens 3D BAG (${nf.format(max)} m²). Controleer de offerte.`}); });
  if(nGeen) warn.push({s:2,t:`${nGeen} woning${nGeen===1?' heeft':'en hebben'} een WOZ-waarde van ${eur.format(WOZ_GRENS).replace(',00','')} of hoger en ${nGeen===1?'telt':'tellen'} niet mee in de aanvraag.`});
  const geenSlecht=WS().filter(w=>w.label==='Onbekend'&&w.bdGeen).length;
  if(geenSlecht) warn.push({s:2,t:`${geenSlecht} woning(en) zonder energielabel zijn opgegeven als goed geïsoleerd. Op de rekentool wordt bij een onbekend label een opsomming van minimaal 2 slechte bouwdelen gevraagd. Controleer of deze woningen mee kunnen doen.`});
  const goed=WS().filter(w=>['A','B','C'].includes(w.label));
  if(goed.length) warn.push({s:2,t:`${goed.length} woning(en) hebben energielabel A, B of C. Op de rekentool staat "evt. aanwezig (slecht) energielabel (D t/m G)". Controleer of deze woningen mee kunnen doen.`});
  act.filter(m=>!m.perWoning).forEach(m=>{
    const verw=deelM2(m), echt=m2Totaal(m);
    if(Math.abs(verw-echt)>0.05) warn.push({s:4,t:`${m.naam}: u heeft ${nf.format(r2(echt))} m² verdeeld, op basis van de offerte is dat ${nf.format(r2(verw))} m². ${echt>verw?'De zelf ingevulde woningen zijn samen al meer dan de offerte.':'Alle woningen zijn zelf ingevuld; pas er één aan of verdeel opnieuw.'}`});
  });
  if(b>0 && totaal()/b>=MAX_PER_WONING) warn.push({s:4,t:'De gemiddelde subsidie per woning is € 4.000 of meer (VOLDOET NIET op het rekenblad).'});
  return {err,warn};
}
function bouwdelen(w){ if(w.bdGeen) return ['Geen (goed geïsoleerd)']; return [...(w.bd||[]), ...(w.bdAnders?[w.bdAnders]:[])].filter(Boolean); }

/* ======= Weergave ======= */
function renderSteps(){
  $('#steps').innerHTML = STEPS.map((t,i)=>`<li class="${i<S.step?'done':''} ${i===S.step?'cur':''}"><button data-go="${i}" ${i>S.step+0&&!canJump(i)?'disabled':''} aria-current="${i===S.step?'step':'false'}"><span class="n">${i+1}</span><span class="t">${t}</span></button></li>`).join('');
}

const VERPLICHT='[data-f=vve],[data-f=vveAdres],[data-f=A],[data-wf=straat],[data-wf=nr],[data-wf=plaats],[data-wf=woz],[data-wf=eig],[data-wf=label],[data-mf=offerte],[data-mf=eisOk],[data-mf=ok70],[data-c=naam],[data-c=email],[data-c=akkoord]';
function markeerLeeg(){
  document.querySelectorAll(VERPLICHT).forEach(el=>{
    if(el.type==='radio') return;
    let leeg = el.type==='checkbox' ? !el.checked : !String(el.value).trim();
    if(el.dataset.f==='A') leeg=!(num(el.value)>0);
    if(el.dataset.wf==='woz'){ const w=S.woningen.find(x=>x.id==el.closest('[data-w]')?.dataset.w); leeg=!(w&&wozBekend(w)); }
    if(el.dataset.mf==='offerte') leeg=!(num(el.value)>0);
    if(el.dataset.c==='email') leeg=!MAIL_RE.test(el.value);
    (el.type==='checkbox'?el.closest('.confirm'):el)?.classList.toggle('leeg',leeg);
  });
  document.querySelectorAll('.won[data-w]').forEach(c=>{ const w=S.woningen.find(x=>x.id==c.dataset.w), bd=c.querySelector('.bd');
    if(w&&bd) bd.classList.toggle('leeg', !w.bdGeen && bouwdelen(w).length<2); });
  document.querySelectorAll('.seg.eig').forEach(g=>g.classList.toggle('leeg',!g.querySelector('input:checked')));
  const lg=document.getElementById('legend'); if(lg) lg.hidden=![...document.querySelectorAll('#view .leeg')].some(el=>el.offsetParent!==null);
}
document.addEventListener('input',()=>markeerLeeg());

function parseNrs(s){
  const out=[];
  String(s).split(/[,;\s]+/).filter(Boolean).forEach(p=>{
    const m=p.match(/^(\d+)\s*[-–tm]+\s*(\d+)$/);
    if(m){ let a=+m[1], b=+m[2]; if(a>b)[a,b]=[b,a]; if(b-a>300) return; for(let i=a;i<=b;i++) out.push(String(i)); }
    else out.push(p);
  });
  return out;
}
function parseToev(s){
  s=String(s||'').trim(); if(!s) return [''];
  const m=s.match(/^(\d+)\s*-\s*(\d+)$/);
  if(m){ const r=[]; for(let i=+m[1];i<=+m[2]&&r.length<50;i++) r.push(String(i)); return r; }
  return s.split(/[,;\s]+/).filter(Boolean);
}

  const p=oppPct(k), tot=nf.format(S.opp3d[k]);
  return num(S.mt[k]?.offerte)
    ? `${nf.format(Math.round(p))}% van ${OPP3D[k].wat} (${tot} m² volgens 3D BAG)${p>=70?'':' — minimaal 70% is vereist'}`
    : `${OPP3D[k].wat[0].toUpperCase()+OPP3D[k].wat.slice(1)} is ${tot} m² volgens 3D BAG`;
}
function mtCard(m){
  const t=S.mt[m.k]||{}; const on=!!t.on; const tr=S._try3;

      <span><span class="nm">${m.naam}</span><span class="eis">${m.uitleg}</span></span>

    ${on?`<div class="body">

      <div class="calc">

          <input type="text" inputmode="decimal" class="num ${tr&&!(num(t.offerte)>0)?'err':''}" data-mf="offerte" value="${esc(t.offerte||'')}" placeholder="0"></label>

      ${OPP3D[m.k]&&S.opp3d?.[m.k]?chkRegel('opppct',m.k,!num(t.offerte)?'info':oppPct(m.k)>=70?'ok':'warn',oppPctHtml(m.k))

}

  const hand=act.some(m=>S.mode[m.k]==='hand'||vastIds(m.k).length);
  const geen=S.woningen.length-B();
  const slim=heeftSlimmeData();
  return `<div class="card">

    ${geen?`<p class="tip">${geen} woning${geen===1?'':'en'} met een WOZ-waarde van ${eur.format(WOZ_GRENS).replace(',00','')} of hoger ${geen===1?'doet':'doen'} niet mee en ${geen===1?'staat':'staan'} hier niet bij.</p>`:''}
    <div class="row" style="justify-content:space-between;margin-bottom:12px">

      ${hand?`<button class="btn small ghost" data-act="regelijk">Eigen aanpassingen wissen</button>`:''}
    </div>
    ${slim&&S.verdeelMethode!=='gelijk'?'<p class="tip">Slim: naar woonoppervlakte (BAG). Dak- en zoldervloerisolatie gaan naar de bovenste verdieping en vloer- en bodemisolatie naar de begane grond, als de verdieping van alle woningen bekend is (EP-Online).</p>':''}
    <div class="tblwrap"><table class="vd" id="vd">

      <tbody>${WS().map(w=>`<tr data-w="${w.id}"><td class="l">${eb(w.label)}${esc(adres(w))}</td>${act.map(m=>`<td data-c="${m.k}">${m.perWoning
        ?`<input type="checkbox" data-vd="${m.k}" ${num(vdGet(w,m.k))===1?'checked':''} aria-label="${esc(m.naam)} ${esc(adres(w))}">`
        :`<input type="text" inputmode="decimal" data-vd="${m.k}" value="${fmtIn(num(vdGet(w,m.k)))}" class="${vastIds(m.k).includes(w.id)?'vast':''}" aria-label="${esc(m.naam)} m² ${esc(adres(w))}">`}</td>`).join('')}<td data-tot></td></tr>`).join('')}</tbody>
      <tfoot><tr><td class="l">Totaal</td>${act.map(m=>`<td data-ft="${m.k}"></td>`).join('')}<td data-ftot></td></tr></tfoot>
    </table></div>
    <p class="hint"><b>Vet</b> = zelf ingevuld · <span style="color:var(--danger)">rood</span> = voldoet niet (min. 10 m² per woning voor muren en gevel, 3 m² voor glas, panelen en deuren samen).</p>
  </div>`;

function paintVerdeling(){
  const tbl=$('#vd'); if(!tbl) return; const act=actief();
  tbl.querySelectorAll('tbody tr').forEach(tr=>{
    const w=S.woningen.find(x=>x.id==tr.dataset.w); const e=bedragWoning(w);
    const td=tr.querySelector('[data-tot]'); td.textContent=eur.format(e); td.classList.toggle('bad',e>MAX_PER_WONING);
    const glas=act.filter(m=>m.min==='glas').reduce((s,m)=>s+num(vdGet(w,m.k)),0);
    act.forEach(m=>{ const v=num(vdGet(w,m.k)); const c=tr.querySelector(`[data-c="${m.k}"]`);
      const bad=(m.min==='m2'&&v>0&&v<m.minWaarde)||(m.min==='glas'&&v>0&&glas<3);
      c.classList.toggle('cellbad',bad); });
  });
  act.forEach(m=>{ const td=tbl.querySelector(`[data-ft="${m.k}"]`); td.innerHTML=m.perWoning?`${m2Totaal(m)}×`:`${nf.format(r2(m2Totaal(m)))} m²${!m.perWoning&&Math.abs(m2Totaal(m)-deelM2(m))>0.05?`<span class="rate" style="color:var(--warn)">offerte: ${nf.format(r2(deelM2(m)))}</span>`:''}`; });
  tbl.querySelector('[data-ftot]').textContent=eur.format(totaal());
}

        <tr><th>Maatregel</th><th class="r">m² / woningen</th><th class="r">Tarief</th><th class="r">Subsidie</th></tr>
        ${act.map(m=>`<tr><td>${m.naam}</td><td class="r">${m.perWoning?m2Totaal(m):nf.format(r2(m2Totaal(m)))+' m²'}</td><td class="r">${eur.format(m.tarief)}</td><td class="r">${eur.format(m2Totaal(m)*m.tarief)}</td></tr>`).join('')}
        <tr><th>Totaal</th><th></th><th></th><th class="r">${eur.format(t)}</th></tr>
        <tr><td colspan="3">Subsidie per woning (gemiddeld) &lt; € 4.000</td><td class="r"><span class="badge ${voldoet?'ok':'bad'}">${voldoet?'VOLDOET':'VOLDOET NIET'}</span></td></tr>

  <div class="card">

    <div class="row">

      <button class="btn" data-act="print">Overzicht als PDF</button>

/* ======= Bronnen en eigen aanpassingen (controleerbaarheid) ======= */
function bronnen(){
  const ws=WS(), alle=S.woningen, r=[];
  const n=f=>ws.filter(f).length;
  const zelf=(x)=>x?'zelf aangepast':'';
  r.push({wat:'Adres van de VvE', waarde:S.vveAdres||'–', bron:S.bron==='pdok'?'PDOK Locatieserver':'zelf ingevuld', let:''});
  if(S.bron==='pdok') r.push({wat:'Panden in de VvE', waarde:String(S.panden||1), bron:S.clusterOk?'VvE-clusterindex':'alleen dit pand (clusterindex niet beschikbaar)', let:S.clusterOk?'':'controleren'});
  r.push({wat:'Woningen in het gebouw (A)', waarde:String(A()||'–'), bron:S.autoA?'BAG (verblijfsobjecten met woonfunctie)':'zelf ingevuld', let:S.autoA&&S.autoA!==A()?`zelf aangepast (BAG: ${S.autoA})`:''});
  const geen=alle.length-ws.length;
  r.push({wat:'Woningen in de aanvraag (B)', waarde:String(ws.length), bron:S.bron==='pdok'?'BAG':'zelf ingevuld', let:[S.autoA&&alle.length!==S.autoA?`${S.autoA-alle.length>0?S.autoA-alle.length+' verwijderd':'toegevoegd'}`:'', geen?`${geen} niet mee (WOZ ≥ ${nf0.format(WOZ_GRENS)})`:''].filter(Boolean).join(', ')});
  if(S.bouwjaar) r.push({wat:'Bouwjaar', waarde:String(S.bouwjaar), bron:'BAG', let:S.bouwjaar>=BOUWJAAR_VOOR?'na 1995':''});
  const mLab=n(w=>w.auto&&'label' in w.auto&&w.auto.label!==w.label), metEP=n(w=>w.auto?.labelBron==='EP-Online');
  if(ws.some(w=>w.auto)) r.push({wat:'Energielabels', waarde:`${metEP} met label`, bron:'EP-Online', let:mLab?`${mLab} zelf aangepast`:''});
  const na=f=>alle.filter(f).length;
  const metWoz=na(w=>w.auto?.wozWaarde), mWoz=na(w=>w.auto?.wozWaarde&&w.auto.wozWaarde!==w.wozWaarde);
  r.push({wat:`WOZ-waarde (grens ${eur.format(WOZ_GRENS).replace(',00','')})`, waarde:`${alle.length-geen} onder, ${geen} boven grens`, bron:`WOZ-waardeloket, peildatum 1-1-2023 (${metWoz} van ${alle.length} opgehaald)`, let:[mWoz?`${mWoz} zelf aangepast`:'', alle.length-metWoz?`${alle.length-metWoz} zelf ingevuld`:''].filter(Boolean).join(', ')});
  r.push({wat:'Eigenaar-bewoner / verhuurder', waarde:`${n(w=>w.eig==='eigenaar-bewoner')} / ${n(w=>w.eig==='eigenaar-verhuurder')}`, bron:'zelf ingevuld', let:''});
  actief().forEach(m=>{
    const t=S.mt[m.k], o=S.opp3d?.[m.k];
    if(OPP3D[m.k]&&o) r.push({wat:m.naam, waarde:`${nf.format(num(t.offerte))} m² (${nf.format(Math.round(oppPct(m.k)))}% van ${nf.format(o)} m²)`, bron:'3D BAG', let:t.autoOfferte&&t.autoOfferte!==t.offerte?'m² zelf aangepast':''});
    else if(MAX3D[m.k]&&o) r.push({wat:m.naam, waarde:`${nf.format(num(t.offerte))} m² (max. ${nf.format(o)} m²)`, bron:'offerte; maximum uit 3D BAG', let:num(t.offerte)>o?'boven maximum':''});
    else r.push({wat:m.naam, waarde:m.perWoning?`${m2Totaal(m)} woningen`:`${nf.format(num(t.offerte))} m²`, bron:'offerte', let:''});
    if(!m.perWoning){ const v=vastIds(m.k).length; r.push({wat:`  verdeling`, waarde:sleutelTekst(m.k), bron:sleutel(m.k).soort==='opp'?'BAG woonoppervlakte':sleutel(m.k).soort==='gelijk'?'':'EP-Online ligging', let:v?`${v} woning${v===1?'':'en'} zelf aangepast`:''}); }
  });
  return r;
}
function bronnenTabel(){
  return `<table class="sum"><tr><th>Gegeven</th><th>Waarde</th><th>Bron</th><th>Aangepast</th></tr>${bronnen().map(b=>`<tr><td>${b.wat.startsWith('  ')?'<span class="muted">↳ '+esc(b.wat.trim())+'</span>':esc(b.wat)}</td><td>${esc(b.waarde)}</td><td class="muted">${esc(b.bron)}</td><td>${b.let?`<b>${esc(b.let)}</b>`:'<span class="muted">–</span>'}</td></tr>`).join('')}</table>`;
}

/* ======= Verzenden (voorlopig demo) =======
   Zet VERZEND_URL op een echt endpoint om te verzenden: er gaat dan een POST met JSON
   (aanvraagData() + de ingevulde rekentool als base64) heen. Zolang hij null is, verstuurt de pagina niets. */
const VERZEND_URL = null;
const MAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function vVerzenden(err){
  const v=S.verzonden;
  if(v) return `<div class="card">
    <h3>Aanvraag verzonden ${VERZEND_URL?'':'<span class="badge bad">Demo</span>'}</h3>
    ${VERZEND_URL?`<div class="note ok">Uw aanvraag is op ${esc(v.datum)} verzonden. Referentie: <b>${esc(v.ref)}</b>. U ontvangt een bevestiging op ${esc(v.email)}.</div>`
      :`<div class="note warn"><b>Dit is een demonstratie: er is niets verstuurd.</b> In de echte versie gaan de ingevulde rekentool (Excel) en de gegevens hieronder naar het subsidiebureau, en krijgt u een bevestiging op ${esc(v.email)}. Dien uw aanvraag voorlopig in via het aanvraagformulier van de gemeente.</div>
      <p class="small">Demo-referentie: <b>${esc(v.ref)}</b> · ${esc(v.datum)}</p>`}
    <details><summary>Wat er verstuurd ${VERZEND_URL?'is':'zou worden'}</summary><pre style="white-space:pre-wrap;font-size:.8rem;max-height:320px;overflow:auto;background:var(--surface-2);padding:10px;border-radius:8px">${esc(JSON.stringify(v.data,null,2))}</pre>
      <p class="hint">Plus de ingevulde rekentool als bijlage (${esc(v.xlsx)}).</p></details>
    <div class="row" style="margin-top:12px"><button class="btn small" data-act="verzendopnieuw">Gegevens aanpassen en opnieuw verzenden</button></div>
  </div>`;
  const tr=S._tryV, c=S.contact||{};
  const fout=(ok,tekst)=>tr&&!ok?`<span class="fielderr">${tekst}</span>`:'';
  const mailOk=MAIL_RE.test(c.email||'');
  return `<div class="card">
    <h3>Aanvraag verzenden ${VERZEND_URL?'':'<span class="badge bad">Demo</span>'}</h3>
    ${VERZEND_URL?'':'<div class="note warn small">Deze knop is nog een demonstratie: er wordt niets verstuurd.</div>'}
    <p>Verstuur de berekening en de ingevulde rekentool rechtstreeks naar het subsidiebureau.</p>
    ${err.length?`<div class="note err small">Los eerst de ${err.length} open punt${err.length===1?'':'en'} hierboven op.</div>`:''}
    <div class="grid2">
      <label class="fld"><span class="l">Naam contactpersoon</span><input type="text" data-c="naam" value="${esc(c.naam||'')}" autocomplete="name" class="${tr&&!c.naam?.trim()?'err':''}">${fout(c.naam?.trim(),'Vul uw naam in.')}</label>
      <label class="fld"><span class="l">Functie in de VvE <span class="muted small">(optioneel)</span></span><input type="text" data-c="rol" value="${esc(c.rol||'')}" placeholder="Bijv. voorzitter, penningmeester"></label>
      <label class="fld"><span class="l">E-mailadres</span><input type="text" inputmode="email" data-c="email" value="${esc(c.email||'')}" autocomplete="email" class="${tr&&!mailOk?'err':''}">${fout(mailOk,'Vul een geldig e-mailadres in.')}</label>
      <label class="fld"><span class="l">Telefoonnummer <span class="muted small">(optioneel)</span></span><input type="text" inputmode="tel" data-c="tel" value="${esc(c.tel||'')}" autocomplete="tel"></label>
    </div>
    <label class="confirm"><input type="checkbox" data-c="akkoord" ${c.akkoord?'checked':''}><span>Ik verklaar dat ik deze gegevens namens de VvE naar waarheid heb ingevuld.${fout(c.akkoord,' Graag bevestigen.')}</span></label>
    <div class="row" style="margin-top:14px"><button class="btn primary" data-act="verzend" ${err.length?'disabled':''}>Aanvraag verzenden${VERZEND_URL?'':' (demo)'}</button><span id="verzendmsg" class="small muted" aria-live="polite"></span></div>
  </div>`;
}

    contact:{naam:S.contact?.naam, rol:S.contact?.rol||'', email:S.contact?.email, telefoon:S.contact?.tel||''},
    aantallen:{A_gebouw:A(), B_aanvraag:b, C_eigenaarBewoners:WS().filter(w=>w.eig==='eigenaar-bewoner').length, D_eigenaarVerhuurders:WS().filter(w=>w.eig==='eigenaar-verhuurder').length},
    maatregelen:actief().map(m=>({code:m.k, naam:m.naam, eenheid:m.perWoning?'woningen':'m2', hoeveelheid:r2(m2Totaal(m)), tarief:m.tarief, bedrag:r2(m2Totaal(m)*m.tarief)})),

    woningen:WS().map(w=>({adres:[w.straat,w.nr,w.toev].filter(Boolean).join(' '), woonplaats:w.plaats, woz:w.woz, wozWaarde:w.wozWaarde||null, eigenaar:w.eig, energielabel:w.label,
      opgehaald:w.auto?{energielabel:w.auto.label, wozWaarde:w.auto.wozWaarde||null}:null, woonoppervlakte:w.opp||null, ligging:w.ligging||null,
      slechteBouwdelen:w.label==='Onbekend'?bouwdelen(w):[], maatregelen:Object.fromEntries(actief().map(m=>[m.k,r2(num(vdGet(w,m.k)))]).filter(([,v])=>v)), subsidie:r2(bedragWoning(w))})),
  };

async function verzend(){
  S._tryV=true; const c=S.contact||{};
  if(checks().err.length || !c.naam?.trim() || !MAIL_RE.test(c.email||'') || !c.akkoord){ render(); document.querySelector('[data-c].err, .fielderr')?.scrollIntoView({block:'center'}); return; }
  const msg=document.getElementById('verzendmsg'); if(msg) msg.textContent='Bezig met verzenden…';
  try{
    const data=aanvraagData();
    const blob=await makeXlsx({download:false});
    const naam=fname('Rekentool')+'.xlsx';
    const d=new Date(), datum=d.toLocaleString('nl-NL',{dateStyle:'long',timeStyle:'short'});
    let ref='DEMO-'+d.toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
    if(VERZEND_URL){
      const b64=await new Promise((ok,nok)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=nok; r.readAsDataURL(blob); });
      const res=await fetch(VERZEND_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,bijlage:{naam,base64:b64}})});
      if(!res.ok) throw new Error('HTTP '+res.status);
      ref=(await res.json().catch(()=>({}))).referentie||ref.replace('DEMO-','');
    }
    S.verzonden={ref,datum,email:c.email,data,xlsx:`${naam}, ${Math.round(blob.size/1024)} kB`};
    save(); render();
  }catch(e){
    console.error(e); if(msg) msg.textContent='Verzenden is niet gelukt. Probeer het later opnieuw of download de Excel en dien die zelf in.';
  }
}

/* ======= Navigatie & validatie per stap ======= */
function stepOk(i){
  if(i===1){ S._try1=true; return A()>0 && !!S.vve.trim() && !!S.vveAdres.trim(); }
  if(i===2){ S._try2=true; const {err}=checks(); return !err.some(e=>e.s===2); }
  if(i===3){ S._try3=true; const {err}=checks(); return !err.some(e=>e.s===3); }
  return true;
}
function go(i){
  if(i>S.step){ for(let s=S.step;s<i;s++){ if(!stepOk(s)){ S.step=s; render(); focusErr(); return; } } }
  S.step=i; render(); window.scrollTo({top:0}); $('#view h2')?.setAttribute('tabindex','-1'); $('#view h2')?.focus({preventScroll:true});
  if(S.step===4) paintVerdeling();
}
function focusErr(){
  const el=document.querySelector('.err, .fielderr'); if(el){ el.scrollIntoView({block:'center'}); (el.matches('input,select')?el:el.closest('.won,.mt')?.querySelector('input,select'))?.focus({preventScroll:true}); }
  if(S.step===2 && !S.woningen.length) $('#bulkmsg').textContent='Voeg eerst minimaal één adres toe.';
}
$('#prev').onclick=()=>go(S.step-1);
$('#next').onclick=()=>go(S.step+1);

/* ======= Adres zoeken (PDOK Locatieserver) en VvE ophalen, zoals de adresverkenner ======= */
const LOCATIESERVER='https://api.pdok.nl/bzk/locatieserver/search/v3_1';
const BAG_API='https://api.pdok.nl/kadaster/bag/ogc/v2';
const LOKAAL=['localhost','127.0.0.1'].includes(location.hostname);
const ORVELIS_URL=LOKAAL?'http://localhost:8788/orvelis.php':'https://adresverkenner.nl/helpers/orvelis.php';
const EP_PROXY_URL='https://adresverkenner.nl/helpers/ep-proxy.php';
const THREEDBAG_PROXY_URL='https://adresverkenner.nl/helpers/3dbag-proxy.php';
// Oppervlakken zoals de dakcheck van de adresverkenner: LOD2.2-vlakken uit 3D BAG, per vlak de echte
// (hellingshoek-gecorrigeerde) oppervlakte via Newell, vlakjes < 1 m² negeren.
// Dak = RoofSurface (terugval b3_opp_dak_plat + b3_opp_dak_schuin), vloer = GroundSurface (terugval b3_opp_grond).
function vlakOpp3D(pts){ let nx=0,ny=0,nz=0; for(let i=0;i<pts.length;i++){ const [x1,y1,z1]=pts[i],[x2,y2,z2]=pts[(i+1)%pts.length]; nx+=(y1-y2)*(z1+z2); ny+=(z1-z2)*(x1+x2); nz+=(x1-x2)*(y1+y2); } return Math.sqrt(nx*nx+ny*ny+nz*nz)/2; }
async function oppervlakkenPand(pandId){
  const d=await getJson(`${THREEDBAG_PROXY_URL}?pandid=${encodeURIComponent(pandId)}`);
  if(d._httpStatus>=400) throw new Error('3D BAG '+d._httpStatus);
  const objs=d.feature?.CityObjects||{}, pand=objs[d._objectId], tf=d.metadata?.transform, vs=d.feature?.vertices;
  if(!pand) throw new Error('geen 3D BAG-model');
  const som={RoofSurface:0,GroundSurface:0};
  if(pand.children?.length&&tf&&vs){
    const [sx,sy,sz]=tf.scale,[tx,ty,tz]=tf.translate, echt=vi=>{ const [x,y,z]=vs[vi]; return [x*sx+tx,y*sy+ty,z*sz+tz]; };
    pand.children.forEach(cid=>{ const g=objs[cid]?.geometry?.find(g=>g.lod==='2.2'); if(!g?.semantics) return;
      g.boundaries[0].forEach((face,i)=>{ const type=g.semantics.surfaces[g.semantics.values[0][i]]?.type; if(!(type in som)) return;
        const a=vlakOpp3D(face[0].map(echt)); if(a>=1) som[type]+=a; }); });
  }
  const at=pand.attributes||{};
  // Muren: niet uit de vlakken (die bevatten ook muren die aan de buren grenzen), maar het door 3D BAG
  // berekende buitenmuuroppervlak, zonder scheidingsmuren. Inclusief ramen en deuren, dus een bovengrens.
  return { dak: som.RoofSurface || (at.b3_opp_dak_plat||0)+(at.b3_opp_dak_schuin||0), vloer: som.GroundSurface || at.b3_opp_grond || 0, muur: at.b3_opp_buitenmuur || 0 };
}
// Welke maatregel welk oppervlak krijgt (100% voorgevuld, 70%-eis zelf getoetst).
const OPP3D={J:{veld:'dak',wat:'het hele dak'},L:{veld:'vloer',wat:'de hele begane-grondvloer'}};
// Alleen een bovengrens tonen (niet voorinvullen): offerte boven het maximum geeft een waarschuwing.
const MAX3D={G:{veld:'muur'},H:{veld:'muur'},I:{veld:'muur'}};
async function vulOppervlakken(tok,panden){
  const res=await perStuk(panden,4,pid=>oppervlakkenPand(pid).catch(e=>{ console.warn('3D BAG pand',pid,e); return null; }));
  if(tok!==vulToken) return;
  const geldig=res.filter(Boolean);
  S.opp3d={van:panden.length};
  Object.entries(MAX3D).forEach(([k,c])=>{ const tot=Math.round(geldig.reduce((a,r)=>a+(r[c.veld]||0),0)*10)/10; if(tot) S.opp3d[k]=tot; });
  Object.entries(OPP3D).forEach(([k,c])=>{
    const tot=Math.round(geldig.reduce((a,r)=>a+(r[c.veld]||0),0)*10)/10;
    if(!tot) return;
    S.opp3d[k]=tot;
    // Alleen invullen als er nog niets staat; de maatregel zelf blijft uit tot de gebruiker hem kiest.
    const t=(S.mt[k] ||= {}); if(!num(t.offerte)) t.offerte=String(tot).replace('.',','); t.autoOfferte=String(tot).replace('.',',');
  });
  save();
  if(S.step===3) render();
}
const WOZ_PROXY_URL=LOKAAL?'http://localhost:8788/woz-proxy.php':'https://adresverkenner.nl/helpers/woz-proxy.php';
// WOZ-waarde op peildatum 1-1-2023, via de eigen proxy (cache, geen CORS-gedoe); anders rechtstreeks.
// Geeft {waarde} of {limiet:true} als het Kadaster-quotum (60/min, 5000/dag) op is.
async function wozOpPeildatum(nummeraanduiding){
  const kies=d=>(d?.wozWaarden||[]).find(w=>String(w.peildatum).startsWith(WOZ_PEILDATUM))?.vastgesteldeWaarde??null;
  let d=null;
  try{ d=await getJson(`${WOZ_PROXY_URL}?nummeraanduiding=${nummeraanduiding}`); }
  catch(e){ // proxy onbereikbaar: rechtstreeks
    try{ const r=await fetch(`https://api.kadaster.nl/lvwoz/wozwaardeloket-api/v1/wozwaarde/nummeraanduiding/${nummeraanduiding}`,{headers:{Accept:'application/json'}});
      if(r.status===429) return {limiet:true}; d=r.ok?await r.json():null; }catch(e2){ return {waarde:null}; }
  }
  if(d?._httpStatus===429) return {limiet:true};
  return {waarde:kies(d)};
}
const WOZ_INTERVAL_MS=1200; // ~50 per minuut, onder de Kadaster-limiet van 60/min
async function vulWoz(tok){
  const nog=()=>tok===vulToken;
  const lijst=S.woningen.filter(w=>w.nummeraanduiding && w.wozWaarde==null);
  let n=0, limiet=false;
  for(const w of lijst){
    if(!nog()) return;
    const t0=Date.now();
    const r=await wozOpPeildatum(w.nummeraanduiding);
    if(r.limiet){ limiet=true; break; }
    w.wozWaarde=r.waarde; n++;
    if(r.waarde){ w.woz=wozUit(r.waarde); Object.assign(w.auto ||= {},{woz:w.woz,wozWaarde:r.waarde}); }
    save();
    setVveStatus({...vveStatus,bezig:true,wozTekst:`WOZ-waarden (1-1-2023) ophalen… ${n} van ${lijst.length}`});
    await new Promise(res=>setTimeout(res,Math.max(0,WOZ_INTERVAL_MS-(Date.now()-t0))));
  }
  if(!nog()) return;
  const met=S.woningen.filter(w=>w.wozWaarde).length;
  setVveStatus({...vveStatus,bezig:false,wozTekst:limiet
    ?`${met} WOZ-waarde${met===1?'':'n'} opgehaald; daarna was het maximum aantal opvragingen bij het Kadaster bereikt. Vul bij de overige woningen de WOZ-waarde zelf in.`
    :`${met} WOZ-waarde${met===1?'':'n'} (1-1-2023) opgehaald en ingevuld.${met<S.woningen.length?` Bij ${S.woningen.length-met} woning(en) was geen WOZ-waarde beschikbaar.`:''}`});
  if(S.step===2 && !document.activeElement?.closest?.('#wlist')) render();
}
const PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 14.314 0z"/></svg>';
let acT=0, acReq=0, acItems=[], acHl={}, acSel=-1;
let vveStatus=null; // {bezig, tekst, soort}
function vveStatusHtml(){ return vveStatus?`<div class="note ${vveStatus.soort||'info'} small" style="margin:0">${vveStatus.tekst}${vveStatus.wozTekst?`<br>${vveStatus.bezig?'⏳ ':''}${vveStatus.wozTekst}`:''}</div>`:''; }
function setVveStatus(st){ vveStatus=st; const el=document.getElementById('vvestatus'); if(el) el.innerHTML=vveStatusHtml(); markeerLeeg(); }
function acEls(){ return {inp:document.querySelector('[data-f=vveAdres]'), ul:document.getElementById('ac-list')}; }
function acSluit(){ const {inp,ul}=acEls(); if(ul){ ul.hidden=true; ul.innerHTML=''; } if(inp){ inp.setAttribute('aria-expanded','false'); inp.removeAttribute('aria-activedescendant'); } acItems=[]; acSel=-1; }
// Zelfde weergave als de adresverkenner: straat+nr (met PDOK-highlighting) en daaronder postcode+plaats.
function acRegel(d){
  const hl=acHl[d.id]?.suggest?.[0];
  const disp=hl?hl.replace(/<(?!\/?b>)[^>]*>/g,''):esc(d.weergavenaam);
  const i=disp.lastIndexOf(', ');
  return i<0?`<span class="main">${disp}</span>`:`<span class="main">${disp.slice(0,i)}</span><span class="place">${PIN}${disp.slice(i+2)}</span>`;
}
function acToon(){
  const {inp,ul}=acEls(); if(!ul) return;
  ul.innerHTML = acItems.length
    ? acItems.map((d,i)=>`<li role="option" id="ac-${i}" data-ac="${i}" aria-selected="${i===acSel}">${acRegel(d)}</li>`).join('')
    : '<li class="leeg">Geen adres in Haarlem gevonden</li>';
  ul.hidden=false; inp.setAttribute('aria-expanded','true');
  if(acSel>=0){ inp.setAttribute('aria-activedescendant','ac-'+acSel); ul.querySelector(`#ac-${acSel}`)?.scrollIntoView({block:'nearest'}); }
  else inp.removeAttribute('aria-activedescendant');
}
function acZoek(inp){
  clearTimeout(acT);
  const q=inp.value.trim();
  if(q.length<2){ acSluit(); return; }
  acT=setTimeout(async()=>{
    const nr=++acReq;
    try{
      const res=await fetch(`${LOCATIESERVER}/suggest?q=${encodeURIComponent(q)}&fq=type:adres&fq=gemeentenaam:Haarlem&rows=7`);
      if(!res.ok) throw new Error(res.status);
      const data=await res.json();
      if(nr!==acReq || document.activeElement!==acEls().inp) return;
      acItems=data.response?.docs||[]; acHl=data.highlighting||{}; acSel=-1; acToon();
    }catch(e){ console.warn('PDOK-adreszoeker niet bereikbaar',e); acSluit(); }
  },200);
}
function acKies(i){
  const d=acItems[i]; const {inp}=acEls(); if(!d||!inp) return;
  inp.value=d.weergavenaam; S.vveAdres=d.weergavenaam; inp.classList.remove('err'); save(); acSluit(); markeerLeeg();
  vulVvE(d.id);
}
document.addEventListener('keydown',e=>{
  if(!e.target.matches?.('[data-f=vveAdres]')) return;
  if(e.key==='Escape'){ acSluit(); return; }
  if(!acItems.length) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); acSel=Math.min(acSel+1,acItems.length-1); acToon(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); acSel=Math.max(acSel-1,0); acToon(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(acSel>=0) acKies(acSel); else if(acItems.length===1) acKies(0); }
});
document.addEventListener('mousedown',e=>{
  const li=e.target.closest('[data-ac]'); if(li){ e.preventDefault(); acKies(+li.dataset.ac); return; }
  if(!e.target.closest('.ac')) acSluit();
});
document.addEventListener('focusout',e=>{ if(e.target.matches?.('[data-f=vveAdres]')) setTimeout(acSluit,150); });

async function getJson(url){ const r=await fetch(url,{headers:{Accept:'application/json'}}); if(!r.ok){ const e=new Error(`HTTP ${r.status}`); e.status=r.status; throw e; } return r.json(); }
async function perStuk(items,n,fn){ const q=items.map((x,i)=>[x,i]); const out=[]; await Promise.all(Array.from({length:Math.min(n,q.length)},async()=>{ while(q.length){ const [x,i]=q.shift(); out[i]=await fn(x,i); } })); return out; }
let vulToken=0;
// Eén adres -> pand -> VvE-cluster (orvelis) -> alle verblijfsobjecten -> labels + WOZ -> stap 3.
async function vulVvE(locId){
  const tok=++vulToken; const nog=()=>tok===vulToken;
  try{
    setVveStatus({bezig:true,tekst:'Gebouw opzoeken…'});
    const look=await getJson(`${LOCATIESERVER}/lookup?id=${encodeURIComponent(locId)}&fl=adresseerbaarobject_id`);
    const bagid=look.response?.docs?.[0]?.adresseerbaarobject_id; if(!bagid) throw new Error('geen BAG-id');
    const vbo=(await getJson(`${BAG_API}/collections/verblijfsobject/items?identificatie=${bagid}&limit=1`)).features?.[0]?.properties;
    const pandHref=vbo?.['pand.href']?.[0]; if(!pandHref) throw new Error('geen pand');
    const pand=await getJson(pandHref); const pandProps=pand.properties||pand;
    let panden=[pandProps.identificatie], clusterOk=true, clusterReden='';
    try{ const c=await getJson(`${ORVELIS_URL}?action=cluster&pandid=${pandProps.identificatie}`); panden=c.clusters?.[pandProps.identificatie]||panden; }
    catch(e){ clusterOk=false; console.warn('VvE-clusterindex niet beschikbaar',e);
      clusterReden = location.protocol==='file:'
        ? 'De rekenhulp is als los bestand geopend; de VvE-indeling werkt alleen als de rekenhulp via adresverkenner.nl wordt geopend.'
        : e.status===403 ? 'De VvE-indeling is alleen beschikbaar vanaf de netwerken van de gemeente Haarlem.'
        : 'De VvE-indeling is nu niet bereikbaar.'; }
    if(!nog()) return;
    let hrefs=pandProps['verblijfsobject.href']||[];
    if(panden.length>1){
      setVveStatus({bezig:true,tekst:`VvE met ${panden.length} panden gevonden, adressen ophalen…`});
      const ps=await perStuk(panden,6,pid=>getJson(`${BAG_API}/collections/pand/items?identificatie=${pid}&limit=1`).then(d=>d.features?.[0]?.properties).catch(()=>null));
      hrefs=ps.filter(Boolean).flatMap(p=>p['verblijfsobject.href']||[]);
    }
    let klaar=0;
    const vbos=(await perStuk(hrefs,8,h=>getJson(h).then(f=>f.properties||f).catch(()=>null))).filter(Boolean)
      .filter(v=>String(v.gebruiksdoel||'').includes('woonfunctie')&&v.woonplaats_naam==='Haarlem')
      .sort((a,b)=>(a.openbare_ruimte_naam||'').localeCompare(b.openbare_ruimte_naam||'')||(a.huisnummer??0)-(b.huisnummer??0)||`${a.huisletter||''}${a.toevoeging||''}`.localeCompare(`${b.huisletter||''}${b.toevoeging||''}`));
    if(!vbos.length) throw new Error('geen woningen');
    if(!nog()) return;
    // EP-Online: 404 = geen label (dan "Onbekend"); een mislukte aanvraag wordt één keer herhaald en
    // blijft anders leeg, zodat een storing niet stilletjes als "geen label" wordt ingevuld.
    const epHaal=async id=>{ for(let poging=0;poging<2;poging++){ try{ const d=await getJson(`${EP_PROXY_URL}?bagid=${encodeURIComponent(id)}`);
        if(d._httpStatus===404) return {r:null}; if(d._httpStatus>=400) throw new Error('EP '+d._httpStatus); return {r:d['0']||d}; }
      catch(e){ if(poging) return {fout:true}; await new Promise(z=>setTimeout(z,800)); } } };
    const info=await perStuk(vbos,4,async v=>{
      const {r,fout}=await epHaal(v.identificatie);
      if(nog()) setVveStatus({bezig:true,tekst:`Energielabels ophalen… (${++klaar} van ${vbos.length})`});
      return {fout, ep:r&&(r.LabelLetter||r.labelLetter||r.Energieklasse||r.energieklasse)||null, sub:r&&(r.Gebouwsubtype||r.gebouwsubtype)||''};
    });
    if(!nog()) return;
    const data={woningen:vbos.map((v,i)=>({straat:v.openbare_ruimte_naam,huisnummer:v.huisnummer,
      toevoeging:`${v.huisletter||''}${v.toevoeging?(v.huisletter?'-':'')+v.toevoeging:''}`,woonplaats:v.woonplaats_naam,
      energielabel:info[i].fout?'':(info[i].ep||'Onbekend'),wozWaarde:null}))};
    if(S.woningen.length && !confirm(`Er staan al ${S.woningen.length} woningen bij stap 3. Vervangen door de ${vbos.length} woningen van deze VvE?`)){ setVveStatus(null); return; }
    const t=fromPre(data,{mt:{}});
    t.woningen.forEach((w,i)=>{ w.nummeraanduiding=vbos[i].hoofdadres_identificatie; w.wozWaarde=null;
      w.opp=num(vbos[i].oppervlakte)||null; w.ligging=liggingRang(info[i].sub);
      w.auto=info[i].fout?{labelBron:'ophalen mislukt'}:{label:w.label, labelBron:info[i].ep?'EP-Online':'geen label in EP-Online'}; });
    const labelFout=info.filter(x=>x.fout).length;
    S.woningen=t.woningen; S.A=String(vbos.length); S.verdeling={}; S.mode={}; S.vast={}; S.bron='pdok'; S.autoA=vbos.length; S.panden=panden.length; S.clusterOk=clusterOk; S.opp3d=null; S.bouwjaar=num(pandProps.bouwjaar)||null;
    const a=document.querySelector('[data-f=A]'); if(a){ a.value=S.A; a.classList.remove('err'); }
    save(); updateLive();
    setVveStatus({soort:clusterOk?'ok':'warn',tekst:`<b>${vbos.length} woning${vbos.length===1?'':'en'}</b> gevonden${panden.length>1?` in ${panden.length} panden`:''} en klaargezet bij stap 3, met energielabels${labelFout?` (bij ${labelFout} woning${labelFout===1?'':'en'} kon het label niet worden opgehaald; kies het zelf)`:''}. Controleer ze daar.`
      +(S.bouwjaar>=BOUWJAAR_VOOR?`<br>Let op: volgens de BAG is het gebouw in ${S.bouwjaar} gebouwd; de regeling geldt voor gebouwen van vóór ${BOUWJAAR_VOOR}.`:'')
      +(clusterOk?'':`<br>${clusterReden} Dit zijn daarom alleen de woningen in dit ene pand. Hoort er nog een ander pand bij de VvE? Voeg die adressen dan bij stap 3 toe.`),
      bezig:true,wozTekst:'WOZ-waarden (1-1-2023) ophalen…'});
    vulWoz(tok);
    vulOppervlakken(tok,panden);
  }catch(e){
    console.warn('VvE ophalen mislukt',e);
    if(nog()) setVveStatus({soort:'warn',tekst:'De woningen van dit adres konden niet automatisch worden opgehaald. U kunt ze bij stap 3 zelf toevoegen.'});
  }
}

function fname(deel){
  const d=new Date(); const ds=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const v=(S.vve||S.vveAdres||'VvE').replace(/[\\/:*?"<>|]+/g,'').trim().replace(/\s+/g,' ');
  return `${ds}_${v}_${deel}`;
}
function download(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function xesc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');}
/* Vult één cel in een <row>-fragment; behoudt opmaak (s=) en formules, zet berekende waarde. */
function setCell(rowXml, ref, val){
  const re=new RegExp('<c r="'+ref+'"([^>]*?)(/>|>([\\s\\S]*?)</c>)');
  const m=rowXml.match(re);
  if(!m){ // cel bestaat niet: voeg toe aan einde van de rij (kolomvolgorde is voor onze cellen gegarandeerd aanwezig in template)
    if(val===null||val===undefined||val==='') return rowXml;
    throw new Error('Cel '+ref+' ontbreekt in template');
  }
  const attrs=m[1].replace(/\s+t="[^"]*"/,'');
  const inner=m[3]||'';
  const f=(inner.match(/<f[^>]*\/>|<f[^>]*>[\s\S]*?<\/f>/)||[''])[0];
  let out;
  if(f){
    if(typeof val==='string') out=`<c r="${ref}"${attrs} t="str">${f}<v>${xesc(val)}</v></c>`;
    else out=`<c r="${ref}"${attrs}>${f}<v>${Math.round((+val||0)*1e6)/1e6}</v></c>`;
  } else if(val===null||val===undefined||val==='') out=`<c r="${ref}"${attrs}/>`;
  else if(typeof val==='number') out=`<c r="${ref}"${attrs}><v>${val}</v></c>`;
  else out=`<c r="${ref}"${attrs} t="inlineStr"><is><t xml:space="preserve">${xesc(val)}</t></is></c>`;
  return rowXml.replace(re,()=>out);
}
function patchSheet(xml, cells){ // cells: {A1:val}
  const byRow={};
  Object.entries(cells).forEach(([ref,v])=>{ const r=ref.match(/\d+/)[0]; (byRow[r] ||= {})[ref]=v; });
  return xml.replace(/<row r="(\d+)"[\s\S]*?<\/row>/g,(row,r)=>{
    const c=byRow[r]; if(!c) return row;
    for(const [ref,v] of Object.entries(c)) row=setCell(row,ref,v);
    return row;
  });
}
function buildCells(){
  const a=A(), b=B(), act=actief();
  const ws=WS(), C=ws.filter(w=>w.eig==='eigenaar-bewoner').length, D=ws.filter(w=>w.eig==='eigenaar-verhuurder').length;
  const s1={E19:a,E20:b,E21:C,E22:D,E23:a?b/a:0,E24:b*MAX_PER_WONING};
  let tot=0;
  M.forEach(m=>{ const q=S.mt[m.k]?.on?r2(m2Totaal(m)):0; const g=q*m.tarief; tot+=g; s1['F'+m.row]=q||null; s1['G'+m.row]=g; });
  s1.G43=tot; s1.G44=b?tot/b:0; s1.G45=(b?tot/b:0)<MAX_PER_WONING?'VOLDOET':'VOLDOET NIET'; s1.G46=b*MAX_PER_WONING;
  const s2={I25:b*MAX_PER_WONING};
  const colIdx=c=>c.split('').reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0);
  const colName=n=>{let s='';while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;};
  let sum2=0;
  for(let i=0;i<MAX_ROWS;i++){
    const r=32+i, w=ws[i];
    let rowTot=0;
    M.forEach(m=>{ const q=w&&S.mt[m.k]?.on?r2(num(vdGet(w,m.k))):0; const ec=colName(colIdx(m.col)+1); s2[m.col+r]=q||null; s2[ec+r]=q*m.tarief; rowTot+=q*m.tarief; });
    s2['I'+r]=rowTot; sum2+=rowTot;
    if(w){
      Object.assign(s2,{['A'+r]:w.straat,['B'+r]:/^\d+$/.test(w.nr)?+w.nr:w.nr,['C'+r]:w.toev||null,['D'+r]:w.plaats,['E'+r]:w.woz,['F'+r]:w.eig,['G'+r]:w.label,['H'+r]:w.label==='Onbekend'?bouwdelen(w).join(', '):null});
    }
  }
  s2.I26=sum2;
  return {s1,s2};
}
async function makeXlsx(opts={download:true}){
  if(typeof JSZip==='undefined') throw new Error('de bibliotheek om Excel te maken kon niet laden (geen internet?)');
  syncVerdeling();
  const zip=await JSZip.loadAsync(TEMPLATE_B64,{base64:true});
  const {s1,s2}=buildCells();
  const p1='xl/worksheets/sheet1.xml', p2='xl/worksheets/sheet2.xml', pw='xl/workbook.xml';
  zip.file(p1, patchSheet(await zip.file(p1).async('string'), s1));
  zip.file(p2, patchSheet(await zip.file(p2).async('string'), s2));
  zip.file(pw, (await zip.file(pw).async('string')).replace(/<calcPr([^/]*)\/>/,(m,a)=>`<calcPr${a.replace(/\s*fullCalcOnLoad="[^"]*"/,'')} fullCalcOnLoad="1"/>`));
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',compression:'DEFLATE'});
  if(opts.download) download(blob, fname('Rekentool')+'.xlsx');
  return blob;
}
